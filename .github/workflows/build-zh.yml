name: build-zh
on:
  workflow_dispatch:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        shell: pwsh
        run: dotnet restore ExplorerTabUtility/ExplorerTabUtility.csproj

      - name: Build (MSBuild / net481)
        shell: pwsh
        run: msbuild ExplorerTabUtility\ExplorerTabUtility.csproj /p:Configuration=Release /p:TargetFrameworks=net481 /p:Platform=AnyCPU /v:minimal /nologo

      - name: Package
        shell: pwsh
        run: |
          $out = "ExplorerTabUtility\bin\Release\net481"
          if (-not (Test-Path $out)) { Get-ChildItem ExplorerTabUtility\bin -Recurse | Select-Object FullName; throw "output not found" }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "$out\*" -Destination dist -Recurse -Force
          Compress-Archive -Path "dist\*" -DestinationPath "ExplorerTabUtility-zh-net481.zip" -Force
          Get-ChildItem dist | Select-Object Name,Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: ExplorerTabUtility-zh-net481
          path: ExplorerTabUtility-zh-net481.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zh-${{ github.run_number }}
          name: 中文版 v2.5.0 (build ${{ github.run_number }})
          files: ExplorerTabUtility-zh-net481.zip
