name: build-zh
on:
  workflow_dispatch:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore ExplorerTabUtility/ExplorerTabUtility.csproj

      - name: Build (MSBuild / net481)
        shell: pwsh
        run: |
          $msbuild = (Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\2022" -Recurse -Filter MSBuild.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like '*\Bin\MSBuild.exe' } | Select-Object -First 1).FullName
          Write-Host "MSBuild: $msbuild"
          & $msbuild ExplorerTabUtility\ExplorerTabUtility.csproj /p:Configuration=Release /p:TargetFrameworks=net481 /p:Platform=AnyCPU /v:minimal

      - name: Package
        shell: pwsh
        run: |
          $out = "ExplorerTabUtility\bin\Release\net481"
          if (-not (Test-Path $out)) { throw "output not found" }
          Copy-Item "$out\*" -Destination "$env:GITHUB_WORKSPACE\dist" -Recurse -Force
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\dist\*" -DestinationPath "$env:GITHUB_WORKSPACE\ExplorerTabUtility-zh-net481.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ExplorerTabUtility-zh-net481
          path: ExplorerTabUtility-zh-net481.zip

      - name: Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zh-${{ github.run_number }}
          name: 中文版 v2.5.0 build ${{ github.run_number }}
          files: ExplorerTabUtility-zh-net481.zip
